version: "1.0"
name: daily-update
displayName: 每日ETF价格更新
triggers:
  cron:
    - cron: "0 21 * * *"
      branches:
        - main

stages:
  - stage:
      name: update
      displayName: 更新价格
      steps:
        - step: python@latest
          name: fetch_prices
          displayName: 获取ETF价格
          inputs:
            pythonVersion: "3.11"
            commands:
              - pip install requests
              - python fetch_prices.py
              - git config --global user.email "action@gitee.com"
              - git config --global user.name "Gitee Go"
              - git add data/prices.json data/rank_history.json
              - git commit -m "📊 Auto update $(date +%Y-%m-%d)" || echo "No changes"
              - git push