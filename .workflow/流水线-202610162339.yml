version: "1.0"
name: etf-daily-update
displayName: ETF-价格每日更新

triggers:
  cron:
    - cron: "0 21 * * 1-5"
      branches:
        - main

stages:
  - name: update-stage
    displayName: 更新价格
    steps:
      - step: build@shell
        name: shell-build
        displayName: Shell 构建
        inputs:
          commands:
            - python3 --version
            - pip3 install requests || pip install requests
            - python3 fetch_prices.py
            - git config --global user.email "action@gitee.com"
            - git config --global user.name "Gitee Go"
            - git add data/prices.json data/rank_history.json
            - git commit -m "Auto update prices" || echo "No changes"
            - git push origin HEAD:main
