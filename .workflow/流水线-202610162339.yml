version: "1.0"
name: etf-daily-update
displayName: ETF 价格每日更新
stages:
  - stage: "default"
    displayName: "默认阶段"
    trigger: auto
    jobs:
      - job: "default"
        displayName: "默认任务"
        steps:
          - step: build@python
            name: python-build
            displayName: Python 构建
            pythonVersion: "3.10"
            commands:
              - pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
              - pip install requests
              - python fetch_prices.py
              - git config --global user.email "action@gitee.com"
              - git config --global user.name "Gitee Go"
              - git add data/prices.json data/rank_history.json
              - git commit -m "Auto update prices" || echo "No changes"
              - git push
            artifacts:
              - name: BUILD_ARTIFACT
                path:
                  - ./
                type: .tar.gz
            strategy:
              retry: "0"
              resource:
                cpu: "2"
                memory: "4"
triggers:
  - cron: "0 21 * * *"
    branches:
      - main
notify: []