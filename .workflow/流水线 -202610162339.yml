version: "1.0"
name: etf-daily-update
displayName: ETF-价格每日更新

triggers:
  cron:
    - cron: "0 21 * * 1-5"
      branches:
        - main
  push:
    branches:
      - main

stages:
  - name: update-stage
    displayName: 更新价格
    steps:
      - step: build@python
        name: python-build
        displayName: Python 构建
        inputs:
          pythonVersion: "3.10"
          commands:
            - python3 --version
            - pip3 install requests || pip install requests
            - python3 fetch_prices.py
            - cp data/prices.json dist/data/prices.json
            - cp data/rank_history.json dist/data/rank_history.json
            - git config --global user.email "action@gitee.com"
            - git config --global user.name "Gitee Go"
            - git add data/prices.json data/rank_history.json dist/data/prices.json dist/data/rank_history.json
            - git commit -m "Auto update prices" || echo "No changes"
            - git push origin HEAD:main
            - python3 deploy_netlify.py
