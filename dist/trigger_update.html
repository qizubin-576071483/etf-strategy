<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手动更新价格</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Roboto,sans-serif;
            background:#0b0f19;color:#e2e8f0;display:flex;justify-content:center;align-items:center;
            min-height:100vh;flex-direction:column;
        }
        .container{
            background:#1e293b;border-radius:24px;padding:40px 30px;
            max-width:400px;width:90%;text-align:center;
            border:1px solid #334155;box-shadow:0 8px 30px rgba(0,0,0,0.5);
        }
        h1{font-size:24px;margin-bottom:10px;}
        .sub{color:#94a3b8;font-size:14px;margin-bottom:30px;line-height:1.6;}
        .btn{
            width:100%;padding:18px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);
            border:none;border-radius:16px;color:#fff;font-size:22px;font-weight:700;
            cursor:pointer;transition:0.2s;letter-spacing:1px;
        }
        .btn:active{transform:scale(0.96);opacity:0.8;}
        .btn:disabled{opacity:0.6;cursor:not-allowed;}
        .btn.success{background:linear-gradient(135deg,#22c55e,#16a34a);}
        .btn.error{background:linear-gradient(135deg,#ef4444,#dc2626);}
        #status{
            margin-top:20px;font-size:14px;color:#94a3b8;min-height:60px;
            line-height:1.6;word-break:break-all;
        }
        #status .highlight{color:#fbbf24;font-weight:600;}
        #status .ok{color:#4ade80;}
        #status .fail{color:#f87171;}
        .info{
            margin-top:20px;padding:15px;background:#0f172a;border-radius:12px;
            font-size:13px;color:#94a3b8;text-align:left;line-height:1.6;
        }
        .info strong{color:#e2e8f0;}
        .footer{color:#64748b;font-size:12px;margin-top:20px;}
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ 一键更新</h1>
    <div class="sub">点击按钮获取所有 ETF 最新价格</div>
    
    <button class="btn" id="updateBtn" onclick="runUpdate()">📡 立即更新</button>
    
    <div id="status">点击按钮开始更新</div>
    
    <div class="info">
        <strong>说明：</strong><br>
        • 点击后将触发 Gitee 流水线<br>
        • 更新过程约 1-2 分钟<br>
        • 完成后刷新页面查看最新数据
    </div>
    
    <div class="footer">数据将自动保存到 prices.json</div>
</div>

<script>
async function runUpdate() {
    const btn = document.getElementById('updateBtn');
    const status = document.getElementById('status');
    
    btn.disabled = true;
    btn.textContent = '⏳ 更新中...';
    status.innerHTML = '<span style="color:#38bdf8;">正在触发更新...</span>';
    
    try {
        const response = await fetch('/.netlify/functions/trigger_pipeline', { 
            method: 'POST' 
        });
        const data = await response.json();
        
        if (data.success) {
            btn.className = 'btn success';
            btn.textContent = '✅ 更新成功';
            status.innerHTML = `<span class="ok">✅ ${data.message}<br>流水线 ID: ${data.pipelineId}</span>`;
        } else {
            btn.className = 'btn error';
            btn.textContent = ' 更新失败';
            status.innerHTML = `<span class="fail">❌ ${data.error || '未知错误'}</span>`;
        }
    } catch(e) {
        btn.className = 'btn error';
        btn.textContent = '❌ 请求失败';
        status.innerHTML = `<span class="fail">❌ 请求失败：${e.message}</span>`;
    }
    
    setTimeout(() => {
        btn.disabled = false;
        btn.className = 'btn';
        btn.textContent = '📡 立即更新';
    }, 5000);
}
</script>
</body>
</html>
