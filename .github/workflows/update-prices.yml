name: Daily ETF Price Update

on:
  schedule:
    # 每天北京时间21:00运行 (UTC 13:00)
    - cron: '0 13 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Fetch ETF prices
      run: python fetch_prices.py
      
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/prices.json data/rank_history.json
        git diff --staged --quiet || git commit -m "📊 Auto update ETF prices $(date +%Y-%m-%d)"
        git push
